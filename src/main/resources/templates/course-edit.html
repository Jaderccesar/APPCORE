<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editar Curso - APPCORE</title>
    <link rel="stylesheet" href="../static/course-register.css" />
    <script src="../scripts/auth.js"></script>
</head>
<body>

<header class="header">
    <div class="container">
        <div class="header-content">
            <div class="header-left">
                <a onclick="window.location.href='feed.html'" class="logo">APPCORE</a>
                <nav class="nav">
                    <a onclick="window.location.href='feed.html'" class="nav-link" data-show="ESTUDANTE,PROFESSOR">Feed</a>
                    <a onclick="window.location.href='course.html'" class="nav-link" data-show="ESTUDANTE">Cursos</a>
                    <a onclick="window.location.href='challenge.html'" class="nav-link" data-show="ESTUDANTE,PROFESSOR">Desafios</a> 
                    <a onclick="window.location.href='ranking.html'" class="nav-link" data-show="ESTUDANTE,PROFESSOR">Ranking</a>
                    <a onclick="window.location.href='course-teacher.html'" class="nav-link active" data-show="PROFESSOR">Meus Cursos</a>
                </nav>
                <div class="header-right">
                <button onclick="window.location.href='profile.html'" class="btn btn-icon" title="Meu perfil">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" width="22" height="22">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 7.5a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.5 20.25a8.25 8.25 0 0115 0" />
                    </svg>
                </button>
            </div>
            </div>
        </div>
    </div>
</header>

<main>
    <section class="section">
        <div class="container">
            <div class="form-container">
                <div class="form-header">
                    <h1>Editar Curso</h1>
                    <p class="form-subtitle">Modifique as informações e os vídeos deste curso</p>
                </div>

                <form id="course-edit-form" class="course-form">

                    <div class="form-section">
                        <h2 class="form-section-title">Informações Básicas</h2>

                        <div class="form-group">
                            <label for="title" class="form-label">Título *</label>
                            <input type="text" id="title" class="form-input" required />
                        </div>

                        <div class="form-group">
                            <label for="description" class="form-label">Descrição *</label>
                            <textarea id="description" class="form-textarea" required></textarea>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="level" class="form-label">Nível *</label>
                                <select id="level" class="form-select" required>
                                    <option value="BÁSICO">Básico</option>
                                    <option value="INTERMEDIÁRIO">Intermediário</option>
                                    <option value="AVANÇADO">Avançado</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="workload" class="form-label">Carga Horária *</label>
                                <input type="number" id="workload" class="form-input" required />
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <h2 class="form-section-title">Precificação e Status</h2>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="price" class="form-label">Preço *</label>
                                <input type="number" id="price" class="form-input" step="0.01" required />
                            </div>

                            <div class="form-group">
                                <label for="status" class="form-label">Status *</label>
                                <select id="status" class="form-select" required>
                                    <option value="RASCUNHO">Rascunho</option>
                                    <option value="PUBLICADO">Publicado</option>
                                    <option value="ARQUIVADO">Arquivado</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <h2 class="form-section-title">Imagem e Recursos</h2>

                        <div class="form-group">
                            <label for="image_url" class="form-label">URL da imagem *</label>
                            <input type="text" id="image_url" class="form-input" required />
                        </div>

                        <div class="form-group">
                            <label class="form-checkbox-wrapper">
                                <input type="checkbox" id="certificate_enabled" class="form-checkbox" />
                                <span>Habilitar certificado</span>
                            </label>
                        </div>
                    </div>

                    <div class="form-section">
                        <h2 class="form-section-title">Vídeos do Curso</h2>
                        <p class="form-help">Edite ou adicione novos vídeos</p>

                        <div id="videos-container"></div>

                        <button type="button" id="add-video-btn" class="btn btn-outline" style="margin-top: 1rem;">
                            + Adicionar Vídeo
                        </button>
                    </div>

                    <div class="form-actions">
                        <a href="course-teacher.html" class="btn btn-outline btn-lg">Cancelar</a>
                        <button type="submit" class="btn btn-primary btn-lg">Salvar Alterações</button>
                    </div>

                </form>

            </div>
        </div>
    </section>
</main>

<script src="../scripts/course-edit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>
</html>
