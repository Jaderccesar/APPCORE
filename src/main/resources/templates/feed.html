<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed - APPCORE</title>
    <link rel="stylesheet" href="../static/course.css"> 
    <link rel="stylesheet" href="../static/modal.css"> 
    <script src="../scripts/auth.js"></script>
</head>

<!-- MODAL PARA CRIAR POST -->
<div id="modal-overlay" class="modal-overlay" style="display:none;">
    <div class="modal">
        
        <h2>Novo Post</h2>

        <label>Título</label>
        <input id="modal-title-input" type="text" placeholder="Digite um título">

        <label style="margin-top:1rem;">Conteúdo</label>
        <textarea id="modal-content-input" placeholder="Digite o conteúdo"></textarea>

        <div class="modal-footer">
            <button class="btn-cancel" onclick="closePostModal()">Cancelar</button>
            <button class="btn-primary" onclick="publishPostModal()">Publicar</button>
        </div>

    </div>
</div>

<body>

<header class="header">
    <div class="container">
        <div class="header-content">
            <div class="header-left">
                <a onclick="window.location.href='home.html'" class="logo">APPCORE</a>
                <nav class="nav">
                    <a onclick="window.location.href='home.html'" class="nav-link">Home</a>
                    <a onclick="window.location.href='feed.html'" class="nav-link active">Feed</a>
                    <a onclick="window.location.href='course.html'" class="nav-link">Cursos</a>
                    <a onclick="window.location.href='challenge.html'" class="nav-link">Desafios</a>
                    <a onclick="window.location.href='ranking.html'" class="nav-link">Ranking</a>
                </nav>
            </div>
            <div class="header-right">
                <button onclick="window.location.href='profile.html'" class="btn btn-icon" title="Meu perfil">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                         viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"
                         width="22" height="22">
                        <path stroke-linecap="round" stroke-linejoin="round"
                              d="M15.75 7.5a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.5 20.25a8.25 8.25 0 0115 0"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>
</header>

<main>

<section class="section">
    <div class="container">

        <!-- HEADER DO FEED -->
        <div class="section-header">
            <h1>Feed</h1>
            <button id="btn-open-modal" class="btn btn-primary">
                Criar Post 
            </button>
        </div>

        <!-- SE O USUÁRIO FOR PROFESSOR -->
        <div id="create-post-box" style="display:none; margin-bottom: 2rem;">
            <div style="
                border: 1px solid var(--color-gray-200);
                padding: var(--spacing-lg);
                border-radius: var(--radius-lg);
                background: var(--color-gray-50);
            ">
                <textarea id="post-content" placeholder="Compartilhe algo..." 
                    style="width:100%; padding:1rem; border:1px solid var(--color-gray-300);
                           border-radius: var(--radius-md); resize:none; height:100px;"></textarea>
                <button onclick="openPostModal()" class="btn btn-primary">Novo Post</button>
            </div>
        </div>

        <!-- LISTA DE POSTS -->
        <div id="posts-container" class="grid" style="grid-template-columns: 1fr; gap: 2rem;">
            <!-- posts são renderizados via JS -->
        </div>

    </div>
</section>

</main>

<script src="../scripts/feed.js"></script>

</body>
</html>
