<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AppCore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .input-icon {
            color: #9ca3af;
            flex-shrink: 0;
            margin-right: 0.5rem;
        }
    </style>
</head>

<body class="bg-gray-50 min-h-screen antialiased">

    <main class="flex items-center justify-center min-h-screen w-full p-4">

        <div class="w-full max-w-md">
            <div class="bg-white p-8 sm:p-10 rounded-xl shadow-2xl border border-gray-100">
                <div class="text-center">
                    <h1 class="text-3xl font-extrabold text-blue-600 mb-2 tracking-tight">AppCore</h1>
                    <p class="text-sm text-gray-500 mb-8">Entre com suas credenciais para continuar</p>
                </div>

                <form class="space-y-6">
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
                        <div class="flex items-center border border-gray-300 bg-white rounded-lg px-3 py-2 focus-within:ring-2 focus-within:ring-blue-500 focus-within:border-blue-500 transition duration-150">
                            <svg class="input-icon w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                            <input type="email" id="email" name="email" placeholder="seu@email.com" required 
                                class="w-full border-none p-0 focus:ring-0 focus:outline-none text-gray-800 placeholder-gray-400 text-base">
                        </div>
                    </div>
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label for="password" class="block text-sm font-medium text-gray-700">Senha</label>
                            
                        </div>
                        <div class="flex items-center border border-gray-300 bg-white rounded-lg px-3 py-2 focus-within:ring-2 focus-within:ring-blue-500 focus-within:border-blue-500 transition duration-150">
                            <svg class="input-icon w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                            <input type="password" id="password" name="password" placeholder="••••••••" required
                                class="w-full border-none p-0 focus:ring-0 focus:outline-none text-gray-800 placeholder-gray-400 text-base">
                        </div>
                    </div>

                    <button type="submit" id="btn-submit"
                        class="w-full py-3 mt-4 bg-blue-600 text-white font-semibold rounded-lg shadow-md hover:bg-blue-700 transition duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                        Entrar
                    </button>
                    
                    <div id="message-box" class="mt-4 p-3 text-sm text-center rounded-lg hidden" role="alert"></div>

                </form>

                <div class="mt-8 text-center text-sm text-gray-500">
                    Não tem uma conta?
                    <a href="user-register.html" class="font-medium text-blue-600 hover:text-blue-700 transition duration-150">
                        Criar conta
                    </a>
                </div>
            </div>
        </div>
    </main>
</body>

<script src="../scripts/login.js"></script>
</html>
