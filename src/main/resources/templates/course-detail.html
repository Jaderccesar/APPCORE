<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="course-title-page">Detalhes do Curso - APPCORE</title>
    <link rel="stylesheet" href="../static/course.css">
    <style>
        .course-detail-container {
            display: flex;
            gap: 2rem;
            margin-top: 2rem;
        }

        .course-info {
            flex: 2;
        }

        .course-sidebar {
            flex: 1;
            padding: 1.5rem;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            background-color: var(--color-white);
        }

        .detail-image {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: var(--border-radius);
            margin-bottom: 1.5rem;
        }

        .buy-button {
            background-color: var(--color-success);
            color: var(--color-white);
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: var(--border-radius);
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            text-align: center;
            transition: background-color 0.2s;
        }

        .buy-button:hover {
            background-color: #1a9c4a;
        }

        .course-metadata p {
            margin-bottom: 0.5rem;
            font-size: 1rem;
            color: var(--color-text-secondary);
        }

        .course-metadata strong {
            color: var(--color-text-primary);
        }

        #videos-list li {
            margin-bottom: 0.5rem;
            color: var(--color-text-primary);
        }

        @media (max-width: 768px) {
            .course-detail-container {
                flex-direction: column;
            }
            .course-sidebar {
                order: -1;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <div class="container">
        <div class="header-content">
            <div class="header-left">
                <a onclick="window.location.href='home.html'"class="logo">APPCORE</a>
                <nav class="nav">
                    <a onclick="window.location.href='home.html'" class="nav-link">Home</a>
                    <a onclick="window.location.href='course.html'" class="nav-link active">Cursos</a>
                    <a onclick="window.location.href='challenge.html'" class="nav-link">Desafios</a>
                    <a onclick="window.location.href='ranking.html'" class="nav-link">Ranking</a>
                </nav>
            </div>
            <div class="header-right">
                <a onclick="window.location.href='course-register.html'" class="btn btn-outline">Criar Curso</a>
                <button onclick="logout()" class="btn btn-primary">Sair</button>
                <button onclick="window.location.href='profile.html'" class="btn btn-icon" title="Meu perfil">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" width="22" height="22">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 7.5a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.5 20.25a8.25 8.25 0 0115 0" />
                    </svg>
                </button>
            </div>
        </div>
    </div>
</header>

<main>
    <section class="section">
        <div class="container">
            <h1 id="detail-title"></h1>
            <p id="detail-subtitle" class="hero-subtitle" style="text-align: left; margin-top: 0.5rem;"></p>

            <div class="course-detail-container">

                <div class="course-info">
                    <img id="detail-image" class="detail-image" alt="Imagem do Curso">
                    <h2>Descrição Completa</h2>
                    <p id="detail-description"></p>

                    <h3 style="margin-top: 1.5rem;">Conteúdo do Curso</h3>
                    <ul id="videos-list" style="padding-left: 20px;">
                    </ul>
                </div>

                <div class="course-sidebar">
                </div>

            </div>
        </div>
    </section>
</main>

<footer class="footer">
</footer>

<script src="../scripts/course-detail.js"></script>

</body>
</html>
