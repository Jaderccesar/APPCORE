<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Usuário</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> 
</head>

<body>
<div class="container py-5">
    <div class="mx-auto shadow p-4" style="max-width: 800px;">
        <h2 class="text-center mb-4">Cadastro de Usuário</h2>

        <form id="userForm">

            <h5 class="mb-3">Dados Pessoais</h5>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Nome</label>
                    <input type="text" id="name" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">E-mail</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-4">
                    <label class="form-label">CPF</label>
                    <input type="text" id="cpf" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Data de Nascimento</label>
                    <input type="date" id="birthday" class="form-control">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Gênero</label>
                    <select id="genero" class="form-select">
                        <option value="">Selecione...</option>
                        <option value="MALE">Masculino</option>
                        <option value="FEMALE">Feminino</option>
                        <option value="OTHER">Outro</option>
                    </select>
                </div>
            </div>

            <h5 class="mt-4 mb-3">Acesso</h5>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Senha</label>
                    <input type="password" id="password" class="form-control" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Tipo de Conta</label>
                    <select id="accountType" class="form-select" required>
                        <option value="">Selecione...</option>
                        <option value="STUDENT">Estudante</option>
                        <option value="TEACHER">Professor</option>
                    </select>
                </div>
            </div>

            <div id="teacherFields" class="mt-3 d-none">
                <div class="mb-3">
                    <label class="form-label">Área de Especialização</label>
                    <input type="text" id="specializedArea" class="form-control">
                </div>
            </div>

            <div class="text-center mt-4">
                <button type="submit" class="btn btn-primary px-5">Salvar</button>
                <button type="button" class="btn btn-primary px-5" onclick="window.location.href='/src/main/resources/templates/login.html'">Voltar</button>
            </div>
        </form>
    </div> 
</div>

<script src="../scripts/user-form.js"></script> 
</body>
</html>
